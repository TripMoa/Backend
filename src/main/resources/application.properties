################################
# \uAE30\uBCF8 \uC124\uC815
################################
spring.application.name=TripMoa
server.port=8080

################################
# \uAC1C\uBC1C \uC11C\uBC84 \uC124\uC815
################################
cors.allowed-origins=http://localhost:3000,http://localhost:5173
oauth2.redirect-url=http://localhost:3000
ai.server.url=http://python:8000

################################
# \uC2E4\uD589 \uD504\uB85C\uD30C\uC77C
################################
spring.profiles.active=dev,oauth

################################
# Actuator \uC124\uC815
################################
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

################################
# Security \uB85C\uADF8 \uC124\uC815
################################
logging.level.org.springframework.security=DEBUG

################################
# \uD30C\uC77C \uC5C5\uB85C\uB4DC \uC124\uC815
################################
file.upload-dir=./uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

################################
# Redis \uC124\uC815
################################
spring.data.redis.host=${SPRING_REDIS_HOST}
spring.data.redis.port=${SPRING_REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

################################
# JWT Secret
################################
jwt.secret=${JWT_SECRET}

################################
# Naver Cloud OCR & API Gateway
################################
naver.ocr.invoke-url=${NAVER_OCR_INVOKE_URL}
naver.ocr.secret-key=${NAVER_OCR_SECRET_KEY}
naver.ocr.api-gateway-key-id=${NAVER_OCR_GATEWAY_KEY_ID}
naver.ocr.api-gateway-key=${NAVER_OCR_GATEWAY_KEY}

naver.ocr.domain-id=${NAVER_OCR_DOMAIN_ID}
naver.ocr.signature=${NAVER_OCR_SIGNATURE}
naver.ocr.path=${NAVER_OCR_PATH}

################################
# \uC694\uCCAD/\uC751\uB2F5 \uBCF8\uBB38 \uBC84\uD37C \uD06C\uAE30 \uC81C\uD55C
################################
server.tomcat.max-http-form-post-size=10MB
spring.codec.max-in-memory-size=10MB

################################
# 쿠키 기본값 (prod 프로파일에서 덮어씀)
################################
app.cookie.secure=false
app.cookie.same-site=Lax