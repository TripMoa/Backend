################################
# TripMoa 운영 프로파일 (prod)
#
# docker-compose.yml 의 backend 서비스에서
# SPRING_PROFILES_ACTIVE: prod,oauth 로 활성화됨
#
# 환경변수 출처
#  - DB_URL / DB_USERNAME / DB_PASSWORD  → Backend/.env  (env_file)
#  - APP_ORIGIN / COOKIE_*               → 루트 .env     (environment)
#
# ※ Redis 설정은 application.properties(공통)에 있으므로 여기 없음
################################


################################
# swagger / api-docs (운영에서는 비활성화)
# nginx 에서도 /swagger-ui, /v3/api-docs 를 404 로 차단하고 있음
################################
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false


################################
# MySQL
#
# 기존 application-prod.properties 에는 datasource 설정이 없어서
# prod 프로파일로 기동하면 바로 실패했음. dev 에 있던 설정을 옮겨옴
# DB 접속 정보는 Backend/.env 의 환경변수를 통해 주입
################################
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


################################
# JPA
################################
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN


################################
# 리버스 프록시 뒤에서 동작 (필수)
#
# 이 설정이 없으면 OAuth2 redirect-uri 의 {baseUrl} 이
# http://backend:8080 으로 생성되어 소셜 로그인이 전부 깨짐.
# nginx 가 넘겨주는 X-Forwarded-* 헤더를 신뢰하도록 함
################################
server.forward-headers-strategy=framework


################################
# 배포 도메인
#
# cors.allowed-origins  → CorsConfig, WebSocketConfig 가 참조
# oauth2.redirect-url   → OAuth2SuccessHandler, OAuth2FailureHandler 가 참조
#
# 도메인 변경 시 루트 .env 의 APP_ORIGIN 한 줄만 고치면 됨
################################
cors.allowed-origins=${APP_ORIGIN}
oauth2.redirect-url=${APP_ORIGIN}


################################
# refreshToken 쿠키
#
# CookieUtil 이 이 값을 읽어 쿠키를 생성함
#  - HTTP  환경 : secure=false
#  - HTTPS 환경 : secure=true  (false 로 두면 브라우저가 쿠키를 거부)
################################
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}


################################
# 업로드 경로
# docker-compose.yml 의 uploads_data 볼륨 마운트 위치와 일치해야 함
################################
file.upload-dir=/app/uploads/


################################
# 운영 로그 레벨
# security 를 DEBUG 로 두면 로그에 토큰이 노출되므로 INFO 유지
################################
logging.level.org.springframework.security=INFO
logging.level.root=INFO
